name: Social post drafts

# Every morning: scan what's topical, make 3 drafts (a video, a swipe
# carousel and a single picture), and send them to Connor in Telegram. The
# Cloudflare Worker then handles his taps and posts the approved ones, so no
# computer needs to be on. This repository is public, so GitHub's minutes
# are free and unlimited.
on:
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC
  workflow_dispatch:
    inputs:
      extra:
        description: "Make this many extra drafts today (0 = the normal daily 3)"
        default: "0"

concurrency:
  group: social-drafts
  cancel-in-progress: false

permissions:
  contents: write # only to save the daily "last run" note below

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: FFmpeg for the videos
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Make and send today's drafts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          DRAFTS_SECRET: ${{ secrets.DRAFTS_SECRET }}
          EXTRA: ${{ inputs.extra || '0' }}
        run: |
          if [ "$EXTRA" != "0" ]; then node marketing/autopost/make-drafts.mjs --send --extra "$EXTRA"; else node marketing/autopost/make-drafts.mjs --send; fi
      # GitHub switches off scheduled jobs in public repositories after 60
      # days with no activity, so each run saves a one-line note.
      - name: Save the last-run note
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > marketing/autopost/data/last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/autopost/data/last-run.txt
          git commit -m "Drafts sent $(date -u +%Y-%m-%d)" && git push || echo "nothing to save"
      - name: Tell Connor if it failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Today's drafts could not be made (GitHub job failed). Already-approved posts still go out." > /dev/null
